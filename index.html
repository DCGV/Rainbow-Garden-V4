}

function completeLevel() {
  const i = L.i, s = L.chars.S, d = L.chars.D;
  L.done = true; L.doneT = 0; L.stone.taken = true;
  s.cheer = 3; d.cheer = 3; s.path = null; d.path = null;
  Save.d.stones[i] = 1;
  if (i === 4) Save.d.won5 = 1;
  if (i < LEVELS.length - 1) { if (Save.d.unlocked < i + 1) Save.d.unlocked = i + 1; Save.d.level = i + 1; }
  else { Save.d.won = 1; Save.d.level = 0; }
  // SCORING: the stone and the level bonus, then this run's tally. The prizes come back the next time this level is played.
  const tally = Score.level(i, Save.d.run[i] | 0);
  Save.d.pts += CONFIG.points.stone + CONFIG.points.level;
  if (tally.sum > Save.d.best[i]) Save.d.best[i] = tally.sum;
  tally.tot1 = Save.d.pts; tally.tot0 = Math.max(0, Save.d.pts - tally.sum);
  G.tally = tally;
  Save.d.run[i] = 0;
  if (i % 2 === 1) { const k = (i - 1) / 2; if (!Save.d.bonus[k]) Save.d.bonus[k] = 1; }
  Save.store(); Hud.jar();
  Snd.sfx('fanfare'); Dog.cheer();
  burst(L.stone.x + 0.5, L.stone.y + 0.5, STONES[i].c, 26, groundY(L.stone.x, L.stone.y) + 0.8);
  spawnConfetti(Save.d.set.calm ? 18 : 70);
  updateHud();
}

function spawnConfetti(n) {                                 // confetti falls around the camera's target
  const c = Cam.tgt;
  for (let i = 0; i < n && G.confetti.length < 240; i++) {
    G.confetti.push({ x: c[0] + (Math.random() - 0.5) * 12, y: c[1] + 5 + Math.random() * 5, z: c[2] + (Math.random() - 0.5) * 10,
      vx: (Math.random() - 0.5) * 0.6, vy: -1.1 - Math.random() * 0.9, r: Math.random() * TAU, vr: (Math.random() - 0.5) * 6,
      c: RAINBOW[i % RAINBOW.length], s: 0.07 + Math.random() * 0.06 });
  }
}

/* ---------- one fixed step of the game (1/60 of a second) ---------- */
function update(dt) {
  G.time += dt;
  Snd.music();
  for (let i = G.confetti.length - 1; i >= 0; i--) {
    const c = G.confetti[i];
    c.x += (c.vx + Math.sin(G.time * 2 + c.s * 90) * 0.3) * dt; c.y += c.vy * dt; c.r += c.vr * dt;
    if (c.y < Cam.tgt[1] - 3) G.confetti.splice(i, 1);
  }
  if (G.toastT > 0) { G.toastT -= dt; if (G.toastT <= 0) $('toast').classList.add('hidden'); }
  if (G.tap) { G.tap.t -= dt; if (G.tap.t <= 0) G.tap = null; }
  if (Input.bufT > 0) Input.bufT -= dt;
  Cam.update(dt);
  if (G.screen === 'end') {
    G.endT += dt;
    if (Math.random() < (Save.d.set.calm ? 3 : 24) * dt) spawnConfetti(1);
    if (G.endSay > 0) G.endSay -= dt;
    if (Dog.on() && !G.overlay && G.endT > G.endBark) {          // Don Diego joins the celebration
      Snd.sfx('yip'); G.endSay = 2.2; G.endBark = G.endT + 3 + Math.random() * 3;
    }
    return;
  }
  if (G.screen !== 'game' || !L || G.overlay) return;       // menus and story pause the world
  L.t += dt;

  for (let i = 0; i < L.blocks.length; i++) {               // blocks sliding along their track
    const b = L.blocks[i];
    if (b.anim) {
      b.anim.t += dt / b.anim.dur;
      const u = Math.min(1, b.anim.t);
      b.ax = lerp(b.anim.fx, b.x, u); b.ay = lerp(b.anim.fy, b.y, u);
      if (b.anim.t >= 1) {
        b.anim = null; b.ax = b.x; b.ay = b.y;
        if (find(L.sockets, b.x, b.y)) lockBlock(b);
      }
    }
  }
  for (let i = 0; i < L.rafts.length; i++) {
    const r = L.rafts[i];
    if (r.anim) {
      r.anim.t += dt / r.anim.dur;
      const u = Math.min(1, r.anim.t);
      r.ax = lerp(r.anim.fx, r.x, u); r.ay = lerp(r.anim.fy, r.y, u);
      if (r.anim.t >= 1) { r.anim = null; r.ax = r.x; r.ay = r.y; }
    }
  }
  updatePlatforms(dt);
  updateChar(L.chars.S, dt);
  updateChar(L.chars.D, dt);
  updateAnimal(dt);
  Dog.update(dt);                                           // Don Diego (only for fun: he never changes a puzzle)
  if (L.bz) Bonus.update(dt);                               // the Candy Garden party
  if (L.greet > 0) { L.greet -= dt; if (L.greet <= 0) Dog.cheer(); }   // Don Diego says hello in a new level
  for (let i = 0; i < L.prizes.length; i++) L.prizes[i].ph += dt;
  for (let i = L.pts.length - 1; i >= 0; i--) { const p = L.pts[i]; p.life += dt; p.y += dt * 0.55; if (p.life >= p.max) L.pts.splice(i, 1); }
  Hud.idle(dt);

  for (let i = 0; i < L.mush.length; i++) { if (L.mush[i].sq > 0) L.mush[i].sq = Math.max(0, L.mush[i].sq - dt * 2.4); }
  for (let i = 0; i < L.gaps.length; i++) { if (L.gaps[i].bridged && L.gaps[i].grow < 1) L.gaps[i].grow = Math.min(1, L.gaps[i].grow + dt * 1.6); }
  for (let i = 0; i < L.gates.length; i++) { if (L.gates[i].open && L.gates[i].a < 1) L.gates[i].a = Math.min(1, L.gates[i].a + dt * 1.6); }
  for (let i = 0; i < L.bushes.length; i++) { if (L.bushes[i].shake > 0) L.bushes[i].shake = Math.max(0, L.bushes[i].shake - dt * 1.5); }
  for (let i = 0; i < L.buttons.length; i++) { const b = L.buttons[i]; if (b.pressed && b.pa < 1) b.pa = Math.min(1, b.pa + dt * 3); }

  if (L.plates.length && !L.flags.plates) {                 // magic tiles: every one needs a hero at the same time
    let all = true;
    for (let i = 0; i < L.plates.length; i++) {
      const p = L.plates[i], was = p.down;
      const c = charOn(p.x, p.y);
      p.down = !!c && !c.anim && !c.ride;
      if (p.down && !was) Snd.sfx('click');
      if (!p.down) all = false;
    }
    if (all) {
      L.flags.plates = true;
      const target = L.def.links.plates;
      if (target) activate(target);
    }
  }

  for (let i = L.fx.length - 1; i >= 0; i--) {
    const f = L.fx[i];
    f.life += dt; f.x += f.vx * dt; f.y += f.vy * dt; f.z += f.vz * dt;
    if (f.k === 'spark') f.vy -= 3.2 * dt;
    if (f.life >= f.max) L.fx.splice(i, 1);
  }
  for (let i = L.pops.length - 1; i >= 0; i--) { const p = L.pops[i]; p.life += dt; p.y += dt * 0.5; if (p.life >= p.max) L.pops.splice(i, 1); }
  for (let i = L.bubbles.length - 1; i >= 0; i--) { L.bubbles[i].life += dt; if (L.bubbles[i].life >= L.bubbles[i].max) L.bubbles.splice(i, 1); }
  if (L.hint) { L.hint.t -= dt; if (L.hint.t <= 0) L.hint = null; }
  if (L.bloom > 0 && L.bloom < 1) L.bloom = Math.min(1, L.bloom + dt * 0.8);

  if (!L.done) {                                            // both heroes on the glowing floor = Rainbow Stone!
    const s = L.chars.S, d = L.chars.D;
    const sIn = !s.anim && !s.ride && L.zone[at(s.x, s.y)], dIn = !d.anim && !d.ride && L.zone[at(d.x, d.y)];
    if (sIn && dIn) completeLevel();
    else {
      const cue = sIn ? 'S' : (dIn ? 'D' : '');
      if (cue && cue !== L.zoneCue) toast(cue === 'S' ? 'david' : 'sophia', 't_friend');
      L.zoneCue = cue;
    }
  } else {
    L.doneT += dt;
    if (L.bloom === 0) L.bloom = 0.01;
    if (L.doneT > 2.6 && !L.outro) {
      L.outro = true;
      const i = L.i, last = i >= LEVELS.length - 1;
      Dlg.show([{ k: L.def.outro, pic: ['stone' + i] }], function () { Tally.showLevel(i); }, last ? 'seeEnd' : 'nextLevel');
    }
  }
}

/* =========================================================================
   9b. COMPANION (Don Diego)  -  a little black-and-white Chihuahua who trots after the active hero
   -------------------------------------------------------------------------
   He is only here for fun. None of the puzzle rules (pushing, buttons, switch pads, magic tiles,
   gates, keys, the Rainbow Stone) ever look at him, so every level plays exactly the same with
   him hidden. He walks the same tiles the hero walked, sits down when the hero stops (never on
   anything a puzzle uses), and when he cannot follow (across water, onto a cloud, too far behind)
   he pops over next to the hero with a little sparkle.
   ========================================================================= */
const Dog = {
  on: function () { return !!(Save.d && Save.d.set.dog); },
  make: function () {
    const ch = L.chars[L.active], p = this.spot(ch) || [ch.x, ch.y];
    return { x: p[0], y: p[1], hy: standY(p[0], p[1]), z: 0, yaw: 0, sit: 1, wag: 0, happy: 0, barkT: 0, hop: 0, quiet: 0,
             poofT: 0, poofTo: null, trail: [], who: L.active, still: 0, rest: null, moving: false, run: false, runTo: null,
             goal: null, leap: false };
  },
  pass: function (x, y) { return inb(x, y) && !isSolid(x, y) && !isWater(x, y); },    // he can trot over this tile
  ok: function (x, y) {                                    // he can stand on this tile
    if (!this.pass(x, y) || find(L.mush, x, y)) return false;
    const b = find(L.blocks, x, y);
    return !(b && !b.locked);
  },
  // a tile he may stop on while following: never a button, magic tile, paw print or switch-pad track
  step: function (x, y) {
    if (!this.ok(x, y) || L.track[at(x, y)]) return false;
    return !(find(L.buttons, x, y) || find(L.plates, x, y) || find(L.calls, x, y));
  },
  // a good place to sit: never on anything a puzzle uses, never on a hero, never right in front of the active hero
  calm: function (x, y, ch) {
    if (!this.ok(x, y)) return false;
    const p = at(x, y);
    if (L.track[p] || L.tunnel[p] || L.vine[p]) return false;
    if (find(L.buttons, x, y) || find(L.plates, x, y) || find(L.calls, x, y) || find(L.gates, x, y) || find(L.gaps, x, y)) return false;
    if (L.key && L.key.state === 'ground' && L.key.x === x && L.key.y === y) return false;
    if (L.treasure && !L.treasure.found && L.treasure.x === x && L.treasure.y === y) return false;
    if (prizeAt(x, y)) return false;                       // never sit on a fruit or a candy (it would hide it)
    if (charOn(x, y)) return false;
    if (x === ch.x + DX[ch.dir] && y === ch.y + DY[ch.dir]) return false;
    return Math.abs(heightAt(x, y) - heightAt(ch.x, ch.y)) <= 0.6;
  },
  spot: function (ch) {                                    // the nearest good tile next to a hero, where the camera can see him
    // beside the hero (as the camera sees it) is best, a little toward the camera next; behind the hero is last,
    // because there the hero would hide him
    const cx = Math.sin(Cam.yaw), cz = Math.cos(Cam.yaw), list = [];
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const l = Math.hypot(dx, dy), dot = (dx * cx + dy * cz) / l;
      list.push({ x: ch.x + dx, y: ch.y + dy, sc: Math.abs(dot - 0.25) + (dx && dy ? 0.3 : 0) });
    }
    list.sort(function (a, b) { return a.sc - b.sc; });
    for (let i = 0; i < list.length; i++) { if (this.calm(list[i].x, list[i].y, ch)) return [list[i].x, list[i].y]; }
    let best = null, bd = 99;
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== 2) continue;
      const x = ch.x + dx, y = ch.y + dy, dd = Math.abs(dx) + Math.abs(dy);
      if (dd < bd && this.calm(x, y, ch)) { best = [x, y]; bd = dd; }
    }
    return best;
  },
  restSpot: function (ch, d) {                             // where to sit when the hero stops
    const tr = d.trail;
    for (let i = tr.length - 2; i >= 0 && i >= tr.length - 3; i--) {
      const p = tr[i];
      if (Math.abs(p[0] - ch.x) + Math.abs(p[1] - ch.y) <= 2 && this.calm(p[0], p[1], ch)) return p;
    }
    const cur = [Math.round(d.x), Math.round(d.y)];
    if (Math.abs(cur[0] - ch.x) + Math.abs(cur[1] - ch.y) <= 2 && this.calm(cur[0], cur[1], ch)) return cur;   // already a fine spot
    return this.spot(ch);
  },
  lineOk: function (x0, y0, x1, y1, overWater) {           // can he trot straight there (no walls, no water, no cliffs)?
    const len = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(len / 0.25));
    let px = Math.floor(x0 + 0.5), py = Math.floor(y0 + 0.5), ph = standY(px, py);
    for (let i = 1; i <= n; i++) {
      const tx = Math.floor(lerp(x0, x1, i / n) + 0.5), ty = Math.floor(lerp(y0, y1, i / n) + 0.5);
      if (tx === px && ty === py) continue;
      if (overWater ? (!inb(tx, ty) || isSolid(tx, ty)) : !this.pass(tx, ty)) return false;   // a leap may cross water, never a wall
      if (overWater) { px = tx; py = ty; continue; }
      const hh = standY(tx, ty);
      if (Math.abs(hh - ph) > 1.2) return false;
      px = tx; py = ty; ph = hh;
    }
    return true;
  },
  poof: function (d, p) {                                  // a gentle sparkle, and he is next to the hero
    if (!p || d.poofT > 0) return;
    d.poofT = 0.5; d.poofTo = p; d.goal = null;
    burst(d.x + 0.5, d.y + 0.5, '#ffffff', 8, d.hy + 0.3);
  },
  cheer: function () {                                     // a happy moment: bark, wag, hop
    const d = L && L.dog;
    if (!d || !this.on()) return;
    d.happy = 1.8; d.barkT = 2.4; if (d.hop <= 0) d.hop = 1;
    if (d.quiet <= 0) { Snd.sfx('yip'); d.quiet = 0.9; }
    // his first happy bark in each level is worth 25 points (once per level, ever)
    if (L.bonus < 0 && !(Save.d.barked & (1 << L.i))) {
      Save.d.barked |= (1 << L.i); Save.d.run[L.i] |= RUN_DOG;
      Score.add(CONFIG.points.dog);
      popPts(d.x + 0.5, d.hy + 1.05, d.y + 0.5, 'dog', CONFIG.points.dog);
    }
  },
  bark: function () {                                      // Candy Garden: a happy yip at every catch
    const d = L && L.dog;
    if (!d || !this.on()) return;
    d.happy = 1.2; d.barkT = 1.6; if (d.hop <= 0) d.hop = 1;
    if (d.quiet <= 0) { Snd.sfx('yip'); d.quiet = 0.25; }
  },
  toggled: function () {                                   // switched on or off in Settings (puzzles do not care either way)
    if (!L) return;
    if (!L.dog) L.dog = this.make();
    if (this.on()) {
      const d = L.dog, p = this.spot(L.chars[L.active]);
      if (p) { d.x = p[0]; d.y = p[1]; d.hy = standY(p[0], p[1]); }
      d.trail = []; d.rest = null; d.goal = null; d.poofT = 0; d.poofTo = null; d.who = L.active; d.run = false;
    }
  },
  update: function (dt) {
    const d = L.dog;
    if (!d || !this.on()) return;
    d.wag += dt * (d.happy > 0 ? 30 : (d.moving ? 14 : 7));
    if (d.happy > 0) d.happy -= dt;
    if (d.barkT > 0) d.barkT -= dt;
    if (d.quiet > 0) d.quiet -= dt;
    if (d.hop > 0) d.hop = Math.max(0, d.hop - dt * 2.6);
    d.z = d.hop > 0 ? Math.sin((1 - d.hop) * Math.PI) * 0.3 : 0;
    if (d.poofT > 0) {
      d.poofT -= dt; d.moving = false;
      if (d.poofTo && d.poofT <= 0.25) {
        d.x = d.poofTo[0]; d.y = d.poofTo[1]; d.hy = standY(d.x, d.y); d.poofTo = null;
        d.trail = []; d.rest = null; d.run = false;
        burst(d.x + 0.5, d.y + 0.5, '#fff6a8', 10, d.hy + 0.3);
      }
      return;
    }
    const ch = L.chars[L.active];
    if (d.who !== L.active) { d.who = L.active; d.trail = []; d.rest = null; d.run = true; d.runTo = null; d.goal = null; }   // switched: run to the new hero
    const last = d.trail[d.trail.length - 1];
    if (!last || last[0] !== ch.x || last[1] !== ch.y) { d.trail.push([ch.x, ch.y]); if (d.trail.length > 12) d.trail.shift(); d.rest = null; }
    const busy = !!(ch.anim || ch.ride || (ch.path && ch.path.length));
    d.still = busy ? 0 : d.still + dt;
    // much too far behind (a raft, a cloud, a long slide): pop over, if there is a good spot
    if (Math.hypot(ch.px - d.x, ch.py - d.y) > 6) { const p = this.spot(ch); if (p) { this.poof(d, p); return; } }
    // where to go next
    let goal = null, fromTrail = false, speed = CONFIG.dog.trot;
    if (d.run) {
      if (!d.runTo) d.runTo = this.spot(ch);
      goal = d.runTo; speed = CONFIG.dog.run;
      if (!goal) d.run = false;
    }
    if (!d.run) {
      const keep = busy ? 2 : 1;                           // stay one or two tiles behind the hero
      while (d.trail.length > keep && !this.step(d.trail[0][0], d.trail[0][1])) d.trail.shift();
      if (d.trail.length > keep) { goal = d.trail[0]; fromTrail = true; if (d.trail.length > keep + 2) speed = CONFIG.dog.run; }
      else if (d.still > 0.3) { if (!d.rest) d.rest = this.restSpot(ch, d); goal = d.rest; }
    }
    if (goal && (!d.goal || d.goal[0] !== goal[0] || d.goal[1] !== goal[1])) {   // a new goal: check the way there
      d.goal = goal; d.leap = false;
      if (!this.lineOk(d.x, d.y, goal[0], goal[1])) {
        if (Math.hypot(goal[0] - d.x, goal[1] - d.y) <= 2.2 && this.ok(goal[0], goal[1]) && this.lineOk(d.x, d.y, goal[0], goal[1], true)) { d.leap = true; d.hop = 1; }   // a little jump
        else { this.poof(d, this.spot(ch) || goal); return; }
      }
    }
    d.moving = false;
    if (goal) {
      const dx = goal[0] - d.x, dy = goal[1] - d.y, gd = Math.hypot(dx, dy);
      if (gd > 0.02) {
        const step = Math.min(gd, speed * dt), ox = Math.round(d.x), oy = Math.round(d.y);
        d.x += dx / gd * step; d.y += dy / gd * step; d.moving = true;
        const nx = Math.round(d.x), ny = Math.round(d.y);
        if ((nx !== ox || ny !== oy) && !d.leap && Math.abs(standY(nx, ny) - standY(ox, oy)) > 0.25 && d.hop <= 0) d.hop = 1;   // hop up or down a step
        let ta = Math.atan2(dx, dy) - d.yaw;
        while (ta > Math.PI) ta -= TAU; while (ta < -Math.PI) ta += TAU;
        d.yaw += ta * Math.min(1, dt * 14);
      } else {
        d.x = goal[0]; d.y = goal[1]; d.leap = false;
        if (fromTrail) d.trail.shift();
        if (d.run) { d.run = false; d.runTo = null; d.trail = []; }
        d.goal = null;
      }
    }
    if (!d.moving) {                                       // sit and look at the hero
      if (d.still > 0.3 || !busy) d.sit = Math.min(1, d.sit + dt * 4);
      let ta = Math.atan2(ch.px - d.x, ch.py - d.y) - d.yaw;
      while (ta > Math.PI) ta -= TAU; while (ta < -Math.PI) ta += TAU;
      if (Math.hypot(ch.px - d.x, ch.py - d.y) > 0.3) d.yaw += ta * Math.min(1, dt * 5);
    } else d.sit = Math.max(0, d.sit - dt * 8);
    const gy = (d.leap && d.goal) ? standY(d.goal[0], d.goal[1]) : standY(clamp(Math.round(d.x), 0, L.w - 1), clamp(Math.round(d.y), 0, L.h - 1));   // a leap never dips into water
    d.hy += (gy - d.hy) * Math.min(1, dt * (d.leap ? 6 : 14));
    // his sticker: the first time he follows the heroes into a level
    if (d.moving && !Save.d.dog) { Save.d.dog = 1; Save.store(); toast('dog', 't_dogSticker'); this.cheer(); }
  }
};

/* =========================================================================
   9c. PRIZES  -  fruits and candies along the path in every level (always optional)
   -------------------------------------------------------------------------
   Walk into one, or press the action button next to it. Nothing is ever timed.
   A prize is never solid, so it can never block a puzzle or trap a hero, and it is only
   ever placed on a plain floor tile (see buildPrizes). Collected prizes stay collected
   (they are saved), and they all come back when the level is played again after it is finished.
   ========================================================================= */
const PRIZE_TYPE = { apple: 'fruit', banana: 'fruit', grapes: 'fruit', straw: 'fruit', orange: 'fruit', mango: 'fruit', melon: 'fruit',
                     lolli: 'candy', gummy: 'candy', choco: 'candy', cane: 'candy', jelly: 'candy', drop: 'candy', gold: 'gold' };
function buildPrizes(lv, run) {
  const list = lv.def.prizes || [];
  for (let k = 0; k < list.length && k < 12; k++) {
    const q = list[k], x = q[0] | 0, y = q[1] | 0, kind = q[2];
    if (!PRIZE_TYPE[kind] || x < 0 || y < 0 || x >= lv.w || y >= lv.h) continue;
    const p = y * lv.w + x;
    if (lv.raw[p] !== '.' || lv.solid[p] || lv.track[p] || lv.zone[p]) continue;   // plain floor only: never on a puzzle tile
    lv.prizes.push({ x: x, y: y, kind: kind, k: k, got: !!(run & (1 << k)), ph: k * 1.7 });
  }
}
function prizeAt(x, y) {
  if (!L) return null;
  for (let i = 0; i < L.prizes.length; i++) { const p = L.prizes[i]; if (!p.got && p.x === x && p.y === y) return p; }
  return null;
}
function collectPrizes(ch) {
  if (!L || L.bonus >= 0) return;
  for (let i = 0; i < L.prizes.length; i++) { const p = L.prizes[i]; if (!p.got && p.x === ch.x && p.y === ch.y) takePrize(p); }
}
function grabNearPrizes(ch) {                               // the action button: everything within one step
  if (!L || L.bonus >= 0) return 0;
  let n = 0;
  for (let i = 0; i < L.prizes.length; i++) {
    const p = L.prizes[i];
    if (!p.got && Math.max(Math.abs(p.x - ch.x), Math.abs(p.y - ch.y)) <= 1) { takePrize(p); n++; }
  }
  return n;
}
function takePrize(p) {
  if (p.got) return;                                        // points are added exactly once per prize
  p.got = true;
  const type = PRIZE_TYPE[p.kind], n = CONFIG.points[type];
  Save.d.run[L.i] |= (1 << p.k);
  Save.d.jar[p.kind] = (Save.d.jar[p.kind] | 0) + 1;
  if (type === 'gold') Save.d.goldLv |= (1 << L.i);
  Score.add(n);                                             // (this also saves)
  const y0 = groundY(p.x, p.y) + 0.45;
  burst(p.x + 0.5, p.y + 0.5, type === 'gold' ? '#ffe14a' : '#fff6a8', type === 'gold' ? (Save.d.set.calm ? 10 : 24) : 10, y0);
  popPts(p.x + 0.5, y0 + 0.75, p.y + 0.5, 'p_' + p.kind, n);
  if (type === 'gold') { Snd.sfx('gold'); toast('p_gold', 't_gold'); Dog.cheer(); }
  else Snd.sfx('prize');
}
function popPts(x, y, z, icon, n) {                         // the little "+10 points" bubble
  if (!L) return;
  if (L.pts.length > 8) L.pts.shift();
  L.pts.push({ x: x, y: y, z: z, icon: icon, txt: tn('ptsPlus', n), life: 0, max: 1.7 });
  Hud.wake(true);
}

/* =========================================================================
   9d. SCORING  -  points (they only ever go up), the Candy Jar, the level-end tally
   ========================================================================= */
const Score = {
  add: function (n) {
    if (!(n > 0)) return;
    Save.d.pts += n; Save.store(); Hud.jar();
  },
  // The tally rows for one finished run of a level (the run record says which prizes were picked up).
  level: function (i, run) {
    const P = CONFIG.points, def = LEVELS[i], list = def.prizes || [];
    let fruit = 0, candy = 0, gold = 0;
    for (let k = 0; k < list.length && k < 12; k++) {
      if (!(run & (1 << k))) continue;
      const ty = PRIZE_TYPE[list[k][2]];
      if (ty === 'fruit') fruit++; else if (ty === 'candy') candy++; else if (ty === 'gold') gold++;
    }
    const rows = [
      { icon: 'p_apple', k: 'r_fruit', n: fruit, each: P.fruit },
      { icon: 'p_lolli', k: 'r_candy', n: candy, each: P.candy },
      { icon: 'p_gold', k: 'r_gold', n: gold, each: P.gold },
      { icon: def.treasure, k: 'r_treasure', n: (run & RUN_TREASURE) ? 1 : 0, each: P.treasure }];
    if (run & RUN_DOG) rows.push({ icon: 'dog', k: 'r_dog', n: 1, each: P.dog });
    rows.push({ icon: 'stone' + i, k: 'r_stone', n: 1, each: P.stone }, { icon: 'star', k: 'r_level', n: 1, each: P.level });
    let sum = 0;
    for (let r = 0; r < rows.length; r++) { rows[r].pts = rows[r].n * rows[r].each; sum += rows[r].pts; }
    return { rows: rows, sum: sum, title: 'tallyT', sumK: 'levelPts', tot0: 0, tot1: 0 };
  },
  fmt: function (n) {
    const loc = Save.d.lang === 'fr' ? 'fr-CA' : (Save.d.lang === 'pt' ? 'pt-BR' : 'en-US');
    try { return Number(n).toLocaleString(loc); } catch (e) { return String(n); }
  }
};

// The small HUD: the Candy Jar counter in the corner, and the gentle fade when nothing moves.
const Hud = {
  idleT: 0, faded: false, bumpT: 0,
  jar: function () {
    const jf = $('jF'), jc = $('jC'), jp = $('jP');
    if (!jf) return;
    if (L && L.bz) {                                        // Candy Garden: the bonus jar
      $('jarF').classList.add('hidden');
      jc.textContent = String(L.bz.jar); jp.textContent = Score.fmt(L.bz.pts);
      return;
    }
    $('jarF').classList.remove('hidden');
    let f = 0, c = 0;
    if (L && L.bonus < 0) for (let i = 0; i < L.prizes.length; i++) { const p = L.prizes[i]; if (p.got) { if (PRIZE_TYPE[p.kind] === 'fruit') f++; else c++; } }
    jf.textContent = String(f); jc.textContent = String(c); jp.textContent = Score.fmt(Save.d.pts);
  },
  wake: function (bump) {
    this.idleT = 0;
    if (this.faded) { this.faded = false; document.body.classList.remove('hudfade'); }
    if (bump) {
      const b = document.body;
      b.classList.remove('hudbump'); void b.offsetWidth; b.classList.add('hudbump');
      this.bumpT = 0.5;
    }
  },
  idle: function (dt) {                                     // called every step while a level is running
    if (this.bumpT > 0) { this.bumpT -= dt; if (this.bumpT <= 0) document.body.classList.remove('hudbump'); }
    const ch = L.chars[L.active];
    const busy = !!(ch.anim || ch.ride || (ch.path && ch.path.length) || Input.dir() >= 0 || L.done);
    if (busy) { this.idleT = 0; if (this.faded) this.wake(false); return; }
    this.idleT += dt;
    if (this.idleT > 3.2 && !this.faded) { this.faded = true; document.body.classList.add('hudfade'); }
  }
};

// The tally screen: each line pops in and counts up, then the level points and the total.
const Tally = {
  on: false, t: 0, rows: null, els: null, data: null, onNext: null, onReplay: null,
  show: function (data, nextKey, onNext, onReplay) {
    this.data = data; this.onNext = onNext; this.onReplay = onReplay;
    const box = $('tlRows');
    while (box.firstChild) box.removeChild(box.firstChild);
    this.els = [];
    for (let r = 0; r < data.rows.length; r++) {
      const row = data.rows[r], d = document.createElement('div'), cv = document.createElement('canvas');
      const lb = document.createElement('span'), nn = document.createElement('span'), pp = document.createElement('span');
      d.className = 'tl'; cv.className = 'ic'; cv.setAttribute('data-icon', row.icon); cv.setAttribute('data-s', '0.62');
      lb.textContent = t(row.k); nn.className = 'n'; nn.textContent = row.n > 1 || row.each !== row.pts ? '× ' + row.n : '';
      pp.className = 'p'; pp.textContent = '0';
      d.appendChild(cv); d.appendChild(lb); d.appendChild(nn); d.appendChild(pp); box.appendChild(d); drawIconEl(cv);
      this.els.push({ row: d, p: pp, v: row.pts, at: 0.25 + r * (Save.d.set.calm ? 0.22 : 0.36) });
    }
    $('tlT').textContent = t(data.title);
    $('tlSumL').textContent = t(data.sumK);
    $('tlSum').textContent = '0'; $('tlTot').textContent = Score.fmt(data.tot0);
    $('tlNext').textContent = t(nextKey);
    this.t = 0; this.on = true;
    openOv('tally');
    Speech.say(t(data.title) + ' ' + t(data.sumK) + ': ' + data.sum + '. ' + t('totalPts') + ': ' + data.tot1 + '.');
  },
  showLevel: function (i) {
    const data = G.tally || Score.level(i, 0), last = i >= LEVELS.length - 1;
    this.show(data, last ? 'seeEnd' : 'nextLevel', function () { Flow.afterLevel(i); }, function () { goLevel(i); });
  },
  tick: function (dt) {
    if (!this.on || G.overlay !== 'tally') return;
    this.t += dt;
    const els = this.els, ease = function (u) { u = clamp(u, 0, 1); return 1 - (1 - u) * (1 - u); };
    let end = 0.4;
    for (let i = 0; i < els.length; i++) {
      const e = els[i], u = (this.t - e.at) / 0.45;
      if (u >= 0 && !e.shown) { e.shown = true; e.row.classList.add('in'); if (e.v > 0) Snd.sfx('small'); }
      e.p.textContent = Score.fmt(Math.round(e.v * ease(u)));
      end = e.at + 0.5;
    }
    const v = ease((this.t - end) / 0.9), d = this.data;
    $('tlSum').textContent = Score.fmt(Math.round(d.sum * v));
    $('tlTot').textContent = Score.fmt(Math.round(lerp(d.tot0, d.tot1, v)));
  },
  next: function () { if (!this.on) return; this.on = false; closeOv(); if (this.onNext) this.onNext(); },
  replay: function () { if (!this.on) return; this.on = false; closeOv(); if (this.onReplay) this.onReplay(); }
};

/* =========================================================================
   9e. TRANSITIONS  -  every screen change is a soft fade (never a hard cut)
   ========================================================================= */
const Trans = {
  busy: false, q: null,
  go: function (fn) {
    if (this.busy) { this.q = fn; return; }
    this.busy = true; Input.clear();
    const el = $('fade'), me = this;
    el.classList.add('on');
    window.setTimeout(function () {
      try { fn(); }
      finally {
        window.setTimeout(function () {
          el.classList.remove('on');
          window.setTimeout(function () { me.busy = false; if (me.q) { const q = me.q; me.q = null; me.go(q); } }, 360);
        }, 80);
      }
    }, 360);
  }
};
function goLevel(i) { Trans.go(function () { startLevel(i); }); }
const Flow = {
  home: function () { Trans.go(function () { L = null; showScreen('title'); }); },
  // after a level's tally: the grandmas' invitation (after Levels 2, 4, 6, 8 and 10), then the next level or the ending
  afterLevel: function (i) {
    const last = i >= LEVELS.length - 1;
    const cont = function () { if (!last) goLevel(i + 1); else Trans.go(showEnding); };
    if (i % 2 === 1) {
      const k = (i - 1) / 2;
      if (Save.d.bonus[k] !== 2) { Trans.go(function () { Bonus.start(k, cont, true); }); return; }
    }
    cont();
  }
};

/* =========================================================================
   9f. BONUS (Grandma phase)  -  the Candy Garden with Grandma Nina and Grandma Rose
   -------------------------------------------------------------------------
   It opens after Levels 2, 4, 6, 8 and 10. The grandmas wave at the entrance and invite the heroes in.
   Then they throw candies from each side; the heroes catch them in their baskets. There is no timer,
   no penalty and no way to fail: the glowing circle shows where each candy lands (a big catch zone),
   a missed candy waits on the grass, and after a few seconds it hops into the nearest basket by itself.
   The round ends when the grandmas have no candy left. Then they cheer, and give the children a big hug.
   ========================================================================= */
const BONUS_DEF = {
  name: 'bonusName', theme: 'garden', outro: '', treasure: '',
  map: [
    '################',
    '#..............#',
    '#..............#',
    '#g............g#',
    '#..............#',
    '#..............#',
    '#..............#',
    '#......12......#',
    '################'],
  ledges: [], links: {}, intro: [],
  hints: [{ k: 'b_hint', pic: ['sophia', 'plus', 'david', 'arrow', 'basket', 'arrow', 'p_lolli'], at: [] }]
};
const BONUS_KINDS = ['lolli', 'choco', 'cane', 'jelly'];       // the everyday candies (gummy = Bouncy Gummy, drop = Rainbow Drop)
const Bonus = {
  after: null,
  start: function (k, after, invite) {
    k = clamp(k | 0, 0, NBONUS - 1);
    this.after = after || null;
    L = buildLevel(5, BONUS_DEF, k);
    Perf.reset(3);
    Snd.key = [1.0595, 1.1225, 1.1892, 1.2599, 1.3348][k] || 1;
    G.confetti.length = 0; G.tap = null; G.tally = null;
    showScreen('game');
    Cam.yaw = Cam.yawT = 0; Cam.snapNext = true;
    setActive('S', true);
    L.dog = Dog.make();
    const R = rng(4100 + k * 97), q = [];
    for (let i = 0; i < 16; i++) q.push(BONUS_KINDS[i % BONUS_KINDS.length]);
    for (let i = 0; i < 4; i++) q.push('gummy');
    for (let i = 0; i < 3; i++) q.push('drop');
    for (let i = q.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)), tmp = q[i]; q[i] = q[j]; q[j] = tmp; }
    q.push('giant');                                       // the Giant Lollipop is always the last, big and slow
    const st = L.grans;
    L.bz = { k: k, phase: 'invite', t: 0, q: q, total: q.length, next: 0.9, side: 0, fly: [], ground: [], jar: 0, pts: 0,
             cnt: { candy: 0, bouncy: 0, rainbow: 0, giant: 0 }, R: R, shake: 0,
             gr: [{ who: 'nina', x: 6, y: 5, sx: st[0].x, sy: st[0].y, yaw: 0, arm: 0, hop: 0, wave: 1 },
                  { who: 'rose', x: 9, y: 5, sx: st[1].x, sy: st[1].y, yaw: 0, arm: 0, hop: 0, wave: 1 }] };
    Cam.update(0);
    updateHud();
    const pages = [];
    if (invite) pages.push({ k: 'g_inv1', who: 'nina', pic: ['nina', 'plus', 'rose'] }, { k: 'g_inv2', who: 'rose', pic: ['p_lolli', 'p_choco', 'p_gummy', 'p_drop'] });
    pages.push({ k: 'g_how', who: 'nina', pic: ['sophia', 'plus', 'david', 'arrow', 'basket', 'arrow', 'p_lolli'] });
    const me = this;
    Dlg.show(pages, function () { me.begin(); }, 'g_go', { k: 'g_skip', cb: function () { me.skip(); } });
  },
  begin: function () { if (L && L.bz && L.bz.phase === 'invite') { L.bz.phase = 'walk'; L.bz.t = 0; } },
  skip: function () {                                      // a skipped party stays open in the Candy Garden menu
    const a = this.after; this.after = null;
    if (a) a(); else Flow.home();
  },
  // the active hero is helped first: candies land near them (never further than two steps)
  target: function (spread) {
    const bz = L.bz, ch = L.chars[L.active], R = bz.R;
    for (let tries = 0; tries < 20; tries++) {
      const x = clamp(Math.round(ch.x + (R() * 2 - 1) * spread), 2, L.w - 3), y = clamp(Math.round(ch.y + (R() * 2 - 1) * spread), 1, L.h - 2);
      if (isSolid(x, y)) continue;
      let busy = false;
      for (let i = 0; i < bz.fly.length; i++) { if (bz.fly[i].tx === x && bz.fly[i].ty === y) busy = true; }
      if (!busy || tries > 15) return [x, y];
    }
    return [clamp(ch.x, 2, L.w - 3), clamp(ch.y, 1, L.h - 2)];
  },
  throwOne: function () {
    const bz = L.bz, kind = bz.q.shift(), g = bz.gr[bz.side];
    bz.side = 1 - bz.side;
    const tg = this.target(kind === 'giant' ? 0.6 : 2);
    bz.fly.push({ kind: kind, x0: g.x + 0.5 + (g.x < 7 ? 0.35 : -0.35), y0: groundY(Math.round(g.x), Math.round(g.y)) + 1.25, z0: g.y + 0.5,
                  tx: tg[0], ty: tg[1], t: 0, dur: kind === 'giant' ? 2.4 : 1.75, h: kind === 'giant' ? 3.0 : 2.4, bounced: false, auto: null, spin: bz.R() * TAU });
    g.arm = 1; Snd.sfx('throw');
  },
  heroNear: function (x, y, r) {                           // a basket within reach of where the candy lands?
    const a = L.chars[L.active], b = a === L.chars.S ? L.chars.D : L.chars.S, list = [a, b];
    for (let i = 0; i < 2; i++) {
      const ch = list[i];
      if (Math.max(Math.abs(Math.round(ch.px) - x), Math.abs(Math.round(ch.py) - y)) <= r) return ch;
    }
    return null;
  },
  caught: function (c, ch) {
    const bz = L.bz, P = CONFIG.points;
    let n = P.bCandy, icon = 'p_' + c.kind;
    if (c.kind === 'gummy') { n = P.bBouncy; bz.cnt.bouncy++; }
    else if (c.kind === 'drop') { n = P.bRainbow + P.bRainbowBonus; bz.cnt.rainbow++; }
    else if (c.kind === 'giant') { n = P.bGiant; bz.cnt.giant++; icon = 'p_lolli'; }
    else bz.cnt.candy++;
    bz.pts += n; bz.jar++;
    const y0 = ch.hy + 0.9;
    Snd.sfx('catch');
    if (c.kind === 'drop') { for (let i = 0; i < 12; i++) spark(ch.px + 0.5, ch.py + 0.5, RAINBOW[i % 6], i % 3 === 0, y0); toast('p_drop', 't_rainbow'); }
    else burst(ch.px + 0.5, ch.py + 0.5, '#fff6a8', 8, y0);
    if (c.kind === 'giant') { Snd.sfx('gold'); toast('p_lolli', 't_giant'); spawnConfetti(Save.d.set.calm ? 8 : 30); }
    popPts(ch.px + 0.5, y0 + 0.5, ch.py + 0.5, icon, n);
    ch.cheer = Math.max(ch.cheer, 0.6);
    Dog.bark();
    if (Save.d.set.shake && !Save.d.set.calm) bz.shake = 0.28;   // the gentle candy shake (it can be switched off in Settings)
    Hud.jar();
  },
  land: function (c) {                                     // returns true when the candy is finished flying
    const bz = L.bz;
    if (c.auto) { this.caught(c, c.auto); return true; }
    const ch = this.heroNear(c.tx, c.ty, c.kind === 'giant' ? 2 : 1);
    if (ch) { this.caught(c, ch); return true; }
    if (c.kind === 'gummy' && !c.bounced) {                 // a Bouncy Gummy bounces once more, toward the active hero
      const a = L.chars[L.active], dx = Math.sign(a.x - c.tx), dy = Math.sign(a.y - c.ty);
      let nx = clamp(c.tx + dx * 2, 2, L.w - 3), ny = clamp(c.ty + dy * 2, 1, L.h - 2);
      if (isSolid(nx, ny)) { nx = c.tx; ny = c.ty; }
      c.x0 = c.tx + 0.5; c.z0 = c.ty + 0.5; c.y0 = groundY(c.tx, c.ty) + 0.25; c.tx = nx; c.ty = ny;
      c.t = 0; c.dur = 0.95; c.h = 1.8; c.bounced = true;
      Snd.sfx('boing'); burst(c.x0, c.z0, '#ff8fc0', 6, c.y0);
      if (!bz.toldBouncy) { bz.toldBouncy = true; toast('p_gummy', 't_bouncy'); }
      return false;
    }
    bz.ground.push({ kind: c.kind, x: c.tx, y: c.ty, t: 0 });   // it waits on the grass (no penalty)
    Snd.sfx('plop');
    return true;
  },
  touch: function (ch) {                                   // walking next to a candy on the grass picks it up
    const bz = L.bz;
    for (let i = bz.ground.length - 1; i >= 0; i--) {
      const g = bz.ground[i];
      if (Math.max(Math.abs(g.x - ch.x), Math.abs(g.y - ch.y)) <= 1) { bz.ground.splice(i, 1); this.caught(g, ch); }
    }
  },
  grab: function (ch) {
    const bz = L.bz, n = bz.ground.length;
    this.touch(ch);
    return bz.ground.length < n;
  },
  update: function (dt) {
    const bz = L.bz;
    bz.t += dt;
    if (bz.shake > 0) bz.shake = Math.max(0, bz.shake - dt);
    for (let i = 0; i < 2; i++) {
      const g = bz.gr[i];
      if (g.arm > 0) g.arm = Math.max(0, g.arm - dt * 2.2);
      if (g.hop > 0) g.hop = Math.max(0, g.hop - dt * 1.6);
    }
    const walkTo = function (g, x, y, sp) {               // returns true when there
      const dx = x - g.x, dy = y - g.y, d = Math.hypot(dx, dy);
      if (d < 0.03) { g.x = x; g.y = y; return true; }
      const s = Math.min(d, sp * dt); g.x += dx / d * s; g.y += dy / d * s;
      g.yaw = Math.atan2(dx, dy); g.walk = (g.walk || 0) + dt;
      return false;
    };
    const faceTo = function (g, x, y) { let ta = Math.atan2(x - g.x, y - g.y) - g.yaw; while (ta > Math.PI) ta -= TAU; while (ta < -Math.PI) ta += TAU; g.yaw += ta * Math.min(1, dt * 6); };
    const ch = L.chars[L.active];
    if (bz.phase === 'invite') { bz.gr.forEach(function (g) { faceTo(g, ch.px, ch.py); g.wave = 1; }); return; }
    if (bz.phase === 'walk') {
      let there = 0;
      bz.gr.forEach(function (g) { if (walkTo(g, g.sx, g.sy, 2.4)) { there++; faceTo(g, 7.5, 4); g.wave = 0; } });
      if (there === 2 || bz.t > 6) { bz.gr.forEach(function (g) { g.x = g.sx; g.y = g.sy; g.wave = 0; }); bz.phase = 'play'; bz.t = 0; bz.next = 0.8; }
      return;
    }
    if (bz.phase === 'play') {
      bz.gr.forEach(function (g) { faceTo(g, ch.px, ch.py); });
      bz.next -= dt;
      if (bz.next <= 0 && bz.q.length) { this.throwOne(); bz.next = Save.d.set.calm ? 1.9 : 1.55; }
      for (let i = bz.fly.length - 1; i >= 0; i--) {
        const c = bz.fly[i];
        c.t += dt / c.dur; c.spin += dt * 5;
        if (c.t >= 1 && this.land(c)) bz.fly.splice(i, 1);
      }
      for (let i = bz.ground.length - 1; i >= 0; i--) {
        const g = bz.ground[i];
        g.t += dt;
        if (g.t > 3.2) {                                    // still on the grass: it hops into the nearest basket by itself
          const S = L.chars.S, D = L.chars.D;
          const near = Math.hypot(S.px - g.x, S.py - g.y) <= Math.hypot(D.px - g.x, D.py - g.y) ? S : D;
          bz.ground.splice(i, 1);
          bz.fly.push({ kind: g.kind, x0: g.x + 0.5, y0: groundY(g.x, g.y) + 0.2, z0: g.y + 0.5, tx: Math.round(near.px), ty: Math.round(near.py),
                        t: 0, dur: 0.75, h: 1.3, bounced: true, auto: near, spin: 0 });
          Snd.sfx('hop');
        }
      }
      if (!bz.q.length && !bz.fly.length && !bz.ground.length) {
        bz.phase = 'cheer'; bz.t = 0;
        bz.gr.forEach(function (g) { g.hop = 1; g.wave = 1; });
        Snd.sfx('fanfare'); spawnConfetti(Save.d.set.calm ? 16 : 60);
        toast('nina', 'g_cheer');
      }
      return;
    }
    if (bz.phase === 'cheer') {
      if (bz.t > 0.8 && bz.gr[0].hop <= 0) bz.gr.forEach(function (g) { g.hop = 1; });
      if (bz.t > 2.4) { bz.phase = 'hug'; bz.t = 0; bz.gr.forEach(function (g) { g.wave = 0; }); }
      return;
    }
    if (bz.phase === 'hug') {                              // Grandma's Hug: they come to the children
      const S = L.chars.S, D = L.chars.D;
      const spot = function (h, side) { return [clamp(h.px + side * 0.62, 1, L.w - 2), clamp(h.py - 0.2, 1, L.h - 2)]; };
      const a = spot(S, -1), b = spot(D, 1);
      const okA = walkTo(bz.gr[0], a[0], a[1], 3), okB = walkTo(bz.gr[1], b[0], b[1], 3);
      if ((okA && okB) || bz.t > 3.5) {
        faceTo(bz.gr[0], S.px, S.py); faceTo(bz.gr[1], D.px, D.py);

    if (flat) {
      const n = nrm(sa(a), sa(d), sa(b)), nn = (n[0] * mx + n[1] * my + n[2] * mz) < 0 ? [-n[0], -n[1], -n[2]] : n;
      this.vtx(sa(a), nn, u0, v0); this.vtx(sa(d), nn, u0, v1); this.vtx(sa(c), nn, u1, v1);
      this.vtx(sa(a), nn, u0, v0); this.vtx(sa(c), nn, u1, v1); this.vtx(sa(b), nn, u1, v0);
    } else {
      this.vtx(sa(a), a, u0, v0); this.vtx(sa(d), d, u0, v1); this.vtx(sa(c), c, u1, v1);
      this.vtx(sa(a), a, u0, v0); this.vtx(sa(c), c, u1, v1); this.vtx(sa(b), b, u1, v0);
    }
  }
  return this;
};
// a face painted on the front of a sphere (uses one of the face textures)
MB.prototype.face = function (r, yaw, p0, p1, nx, ny) {
  const pt = function (u, v) {
    const ya = lerp(-yaw, yaw, u), pi = lerp(p1, p0, v);
    return [Math.sin(ya) * Math.cos(pi), Math.sin(pi), Math.cos(ya) * Math.cos(pi)];
  };
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const u0 = i / nx, u1 = (i + 1) / nx, v0 = j / ny, v1 = (j + 1) / ny;
    const q = [[u0, v1], [u1, v1], [u1, v0], [u0, v0]].map(function (uv) { const d = pt(uv[0], uv[1]); return { p: [d[0] * r, d[1] * r, d[2] * r], n: d, u: 0.01 + uv[0] * 0.98, v: 0.01 + uv[1] * 0.98 }; });
    const o = [0, 1, 2, 0, 2, 3];
    for (let k = 0; k < 6; k++) { const e = q[o[k]]; this.vtx(e.p, e.n, e.u, e.v); }
  }
  return this;
};
MB.prototype.disc = function (r, seg, y) {
  for (let i = 0; i < seg; i++) {
    const a0 = i / seg * TAU, a1 = (i + 1) / seg * TAU;
    this.vtx([0, y, 0], [0, 1, 0], 0.5, 0.5);
    this.vtx([Math.sin(a0) * r, y, Math.cos(a0) * r], [0, 1, 0], 0.5 + Math.sin(a0) * 0.5, 0.5 + Math.cos(a0) * 0.5);
    this.vtx([Math.sin(a1) * r, y, Math.cos(a1) * r], [0, 1, 0], 0.5 + Math.sin(a1) * 0.5, 0.5 + Math.cos(a1) * 0.5);
  }
  return this;
};
MB.prototype.ring = function (r0, r1, seg, y) {
  for (let i = 0; i < seg; i++) {
    const a0 = i / seg * TAU, a1 = (i + 1) / seg * TAU, s0 = Math.sin(a0), c0 = Math.cos(a0), s1 = Math.sin(a1), c1 = Math.cos(a1);
    this.quad([s0 * r1, y, c0 * r1], [s1 * r1, y, c1 * r1], [s1 * r0, y, c1 * r0], [s0 * r0, y, c0 * r0], [0, 1, 0]);
  }
  return this;
};
MB.prototype.octa = function (r, h, cols) {                   // gem: 6-sided bipyramid, faceted
  const ring = [];
  for (let i = 0; i < 6; i++) ring.push([Math.sin(i / 6 * TAU) * r, 0, Math.cos(i / 6 * TAU) * r]);
  for (let i = 0; i < 6; i++) {
    const a = ring[i], b = ring[(i + 1) % 6];
    this.col(cols[(i * 2) % cols.length]); this.tri([0, h, 0], a, b);
    this.col(cols[(i * 2 + 1) % cols.length]); this.tri([0, -h * 0.8, 0], b, a);
  }
  return this;
};

/* ---------- layout: fits any window, any rotation, and sharp on high-DPI screens ---------- */
function isTablet() {                                       // iPads (they may say "Macintosh") and big Android tablets
  try {
    const ua = String(navigator.userAgent || ''), tp = navigator.maxTouchPoints || 0;
    if (/iPad/.test(ua) || (/Macintosh/.test(ua) && tp > 1)) return true;
    return /Android/.test(ua) && !/Mobile/.test(ua);
  } catch (e) { return false; }
}
function layout() {
  const W = Math.max(200, window.innerWidth || 800), H = Math.max(200, window.innerHeight || 600);
  const dpr = clamp(window.devicePixelRatio || 1, 1, CONFIG.render.dprCap), m = Math.min(W, H);   // capped at 2 (iPads)
  const fs = clamp(Math.round(m * 0.03), 24, 44);             // never smaller than 24 px, and it grows with the window
  const btn = clamp(Math.round(m * 0.1), 64, 100), gap = Math.max(14, Math.round(btn * 0.18));
  const rs = document.documentElement.style;
  rs.setProperty('--btn', btn + 'px'); rs.setProperty('--gap', gap + 'px'); rs.setProperty('--fs', fs + 'px');
  V.W = W; V.H = H; V.dpr = dpr; V.btn = btn; V.rdpr = Math.max(1, window.devicePixelRatio || 1);
  V.tablet = isTablet();
  const cv = $('game'); cv.style.width = W + 'px'; cv.style.height = H + 'px';   // exactly the size the picture is made for
  document.body.classList.toggle('lay-over', m < 520);
  document.body.classList.toggle('narrow', W < 14 + 5 * btn + 3 * gap + 34);   // + and - would touch the arrows: stack them
  GLR.resize();
  drawIcons(document);
  updateHud();
}

// Swipe on the picture to turn the camera; a short tap walks there instead.
const Drag = {
  id: -1, x0: 0, y0: 0, yaw0: 0, moved: false,
  down: function (e) { if (this.id >= 0) return; this.id = e.pointerId; this.x0 = e.clientX; this.y0 = e.clientY; this.yaw0 = Cam.yawT; this.moved = false; },
  move: function (e) {
    if (e.pointerId !== this.id) return;
    const dx = e.clientX - this.x0;
    if (!this.moved && Math.abs(dx) + Math.abs(e.clientY - this.y0) > Math.max(14, V.btn * 0.25)) this.moved = true;
    if (this.moved) Cam.yawT = this.yaw0 - dx * 0.008;
  },
  up: function (e) {
    if (e.pointerId !== this.id) return;
    this.id = -1;
    if (this.moved) { Cam.turn(0); Snd.sfx('switch'); return; }      // settle on the nearest quarter turn
    const tile = GLR.pick(e.clientX, e.clientY);
    if (tile) tapTile(tile[0], tile[1]);
  },
  cancel: function () { if (this.id >= 0 && this.moved) Cam.turn(0); this.id = -1; this.moved = false; }
};

function navFocus(delta) {
  const root = G.overlay ? $(G.overlay) : (G.screen === 'title' ? $('sTitle') : (G.screen === 'end' ? $('sEnd') : null));
  if (!root) return;
  const list = qsa('button:not([disabled]), input', root).filter(function (el) { return el.offsetParent !== null; });
  if (!list.length) return;
  let i = list.indexOf(document.activeElement);
  i = i < 0 ? 0 : (i + delta + list.length) % list.length;
  try { list[i].focus(); } catch (e) { /* ignore */ }
}
function keyDir(e) {
  switch (e.code) {
    case 'ArrowUp': case 'KeyW': return 0;
    case 'ArrowRight': case 'KeyD': return 1;
    case 'ArrowDown': case 'KeyS': return 2;
    case 'ArrowLeft': case 'KeyA': return 3;
    default: break;
  }
  switch (e.key) {
    case 'ArrowUp': case 'Up': return 0; case 'ArrowRight': case 'Right': return 1;
    case 'ArrowDown': case 'Down': return 2; case 'ArrowLeft': case 'Left': return 3;
    default: return -1;
  }
}

    if (G.screen === 'game' && !G.overlay) {
      e.preventDefault(); Drag.down(e);
      try { CAN.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    }
  });
  CAN.addEventListener('pointermove', function (e) { if (G.screen === 'game' && !G.overlay) Drag.move(e); });
  CAN.addEventListener('pointerup', function (e) { if (G.screen === 'game' && !G.overlay) Drag.up(e); else Drag.cancel(); });
  CAN.addEventListener('pointercancel', function () { Drag.cancel(); });
  CAN.addEventListener('lostpointercapture', function (e) { if (e.pointerId === Drag.id) Drag.cancel(); });
  CAN.addEventListener('wheel', function (e) {               // mouse wheel or trackpad: zoom
    if (G.screen !== 'game' || G.overlay) return;
    e.preventDefault();
    const px = e.deltaMode === 1 ? e.deltaY * 16 : (e.deltaMode === 2 ? e.deltaY * 400 : e.deltaY);
    Cam.zoomBy(clamp(px * 0.0016, -CONFIG.camera.zoomStep, CONFIG.camera.zoomStep), true);
  }, { passive: false });
  CAN.addEventListener('webglcontextlost', function (e) { e.preventDefault(); GLR.lost = true; });
  CAN.addEventListener('webglcontextrestored', function () { GLR.lvlFor = null; if (!GLR.init()) showNoGL(); });
  ['click', 'touchend', 'pointerup'].forEach(function (n) { document.addEventListener(n, function () { Snd.unlock(); }, { passive: true }); });
  document.addEventListener('pointerdown', function () { Hud.wake(false); }, { passive: true });   // the HUD comes back on any touch
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

  window.addEventListener('keydown', function (e) {
    Snd.unlock(); Hud.wake(false);
    if (Trans.busy) { if (keyDir(e) >= 0 || e.key === ' ') e.preventDefault(); return; }   // ignore keys during a fade
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key, onButton = document.activeElement && (document.activeElement.tagName === 'BUTTON');
    if (G.overlay === 'dlg') {
      if (k === 'Escape' || ((k === 'Enter' || k === ' ' || e.code === 'Space') && !onButton)) { e.preventDefault(); if (!e.repeat) Dlg.next(); }
      return;
    }
    if (G.screen === 'game' && !G.overlay) {
      const d = keyDir(e);
      if (d >= 0) { e.preventDefault(); if (!e.repeat) Input.press(d, 'key' + d); return; }
      if (k === ' ' || e.code === 'Space' || k === 'e' || k === 'E' || k === 'Enter') { e.preventDefault(); if (!e.repeat) doAction(); return; }
      if (k === '1' || e.code === 'Numpad1') { setActive('S'); return; }
      if (k === '2' || e.code === 'Numpad2') { setActive('D'); return; }
      if (k === 'h' || k === 'H') { showHint(); return; }
      if (k === 'c' || k === 'C') { Cam.reset(); Snd.sfx('ui'); return; }
      if (k === ']' || e.code === 'BracketRight' || k === '+' || k === '=') { e.preventDefault(); Cam.zoomBy(-CONFIG.camera.zoomStep); return; }
      if (k === '[' || e.code === 'BracketLeft' || k === '-' || k === '_') { e.preventDefault(); Cam.zoomBy(CONFIG.camera.zoomStep); return; }
      if (k === 'q' || k === 'Q') { Cam.turn(1); Snd.sfx('switch'); return; }
      if (k === 'r' || k === 'R') { Cam.turn(-1); Snd.sfx('switch'); return; }
      if (k === 'Escape' || k === 'p' || k === 'P') { e.preventDefault(); Snd.sfx('ui'); openOv('pause'); return; }
      return;
    }
    if (k === 'Escape') { e.preventDefault(); if (G.overlay && G.overlay !== 'tally') { Snd.sfx('ui'); closeOv(); } return; }
    const isRange = document.activeElement && document.activeElement.tagName === 'INPUT';
    const d = keyDir(e);
    if (e.code && e.code.indexOf('Key') === 0) return;      // letters do nothing in menus
    if (d === 0 || (d === 3 && !isRange)) { e.preventDefault(); navFocus(-1); }
    else if (d === 2 || (d === 1 && !isRange)) { e.preventDefault(); navFocus(1); }
  });
  window.addEventListener('keyup', function (e) {
    const d = keyDir(e);
    if (d >= 0) Input.release('key' + d);
    if ((e.key === ' ' || e.code === 'Space') && G.screen === 'game' && !G.overlay) e.preventDefault();
  });
  window.addEventListener('blur', autoPause);                // pause when the window or tab loses focus
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { autoPause(); Snd.suspend(); Speech.stop(); }
    else if (Snd.ctx) Snd.unlock();
  });
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { window.setTimeout(layout, 120); });
}

/* =========================================================================
   15. MAIN LOOP  -  small time steps, so the game runs at the same speed everywhere
   ========================================================================= */
const STEP = 1 / 60;
let lastT = 0;

// Graphics setting (Classic N64, Sharp, Ultra, Ultra HD). Changing it only changes how many pixels are drawn.
const Gfx = {
  order: ['classic', 'sharp', 'ultra', 'ultrahd'],
  set: function (g) {
    if (!Save.gfxOk(g)) return;
    Save.d.set.gfx = g; Save.store();
    Dyn.reset();
    GLR.resize(); refreshSettings(); Perf.reset(4);
  },
  // Too slow for a while? Step down once, and always say so (never silently).
  stepDown: function () {
    const i = this.order.indexOf(Save.d.set.gfx);
    if (i <= 0) return false;
    this.set(this.order[i - 1]);
    toast('sunny', 'gfxDrop');
    return true;
  }
};
// Dynamic resolution (Ultra HD only): when the frame rate stays low, the picture gets a little smaller; when it is
// smooth again for a good while, it grows back. It can never ping-pong: once it went up and then had to come down
// again, that lower size becomes the ceiling for the rest of the session. Every change is announced, never silent.
const Dyn = {
  s: 1, cap: 1, lastDown: -1e9, lastUp: -1e9, upped: false,
  reset: function () { this.s = 1; this.cap = 1; this.lastDown = -1e9; this.lastUp = -1e9; this.upped = false; },
  down: function (now) {
    const R = CONFIG.render;
    if (this.s <= R.dynMin + 0.001) return false;
    const ns = Math.max(R.dynMin, Math.round((this.s - R.dynStepDown) * 100) / 100);
    if (this.upped) this.cap = ns;                          // no loop: this is the ceiling from now on
    this.s = ns; this.lastDown = now;
    GLR.resize(); toast('sunny', 'resDown');
    return true;
  },
  up: function (now) {
    const R = CONFIG.render;
    if (this.s >= this.cap - 0.001 || now - this.lastDown < 20) return false;
    this.s = Math.min(this.cap, Math.round((this.s + R.dynStepUp) * 100) / 100); this.lastUp = now; this.upped = true;
    GLR.resize(); toast('sunny', 'resUp');
    return true;
  }
};
// Watches the frame rate while a level is being played (not in menus, not while the tab is hidden).
const Perf = {
  t: 0, n: 0, slow: 0, fast: 0, wait: 3, clock: 0,
  reset: function (wait) { this.t = 0; this.n = 0; this.slow = 0; this.fast = 0; this.wait = wait || 0; },
  tick: function (raw) {
    if (G.screen !== 'game' || G.overlay || document.hidden) { this.t = 0; this.n = 0; this.slow = 0; this.fast = 0; return; }
    if (!(raw > 0) || raw > 0.5) { this.t = 0; this.n = 0; return; }     // a hiccup (tab switch, a dialog): ignore it
    this.clock += raw;
    if (this.wait > 0) { this.wait -= raw; return; }                        // give a new level a moment to settle
    this.t += raw; this.n++;
    if (this.t < 1) return;
    const fps = this.n / this.t, R = CONFIG.render;
    this.t = 0; this.n = 0;
    this.slow = fps < R.slowFps ? this.slow + 1 : 0;
    this.fast = fps >= R.fastFps ? this.fast + 1 : 0;
    if (Save.d.set.gfx === 'ultrahd') {
      if (this.slow >= R.slowSeconds) {
        this.slow = 0; this.fast = 0;
        if (Dyn.down(this.clock)) this.wait = 4;
        else if (Gfx.stepDown()) this.wait = 6;            // already as small as Ultra HD goes: back to Ultra
      } else if (this.fast >= R.fastSeconds) {
        this.fast = 0;
        if (Dyn.up(this.clock)) this.wait = 4;
      }
      return;
    }
    if (this.slow >= R.slowSeconds) { this.slow = 0; if (Gfx.stepDown()) this.wait = 6; }
  }
};

function frame(now) {
  window.requestAnimationFrame(frame);
  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000; lastT = now;
  Perf.tick(dt);
  if (!(dt > 0)) dt = 0;
  if (dt > 0.25) dt = 0.25;                                  // after a pause, do not try to catch up
  // The world moves exactly as far as the time that passed, in steps no longer than 1/60 s, and is then
  // drawn at that very moment. (The old fixed 1/60 s steps were sometimes 0 and sometimes 2 per frame,
  // which made the hero and the camera judder, most of all on 120 Hz iPads.)
  if (dt > 0) { const n = Math.ceil(dt / STEP - 1e-6); for (let i = 0; i < n; i++) update(dt / n); }
  G.fk = dt * 60;
  Tally.tick(dt);
  render();
}
function showNoGL() {                                        // a friendly note in both languages, and nothing breaks
  const box = $('nogl');
  $('noglEn1').textContent = CONFIG.strings.en.nogl1; $('noglEn2').textContent = CONFIG.strings.en.nogl2;
  $('noglFr1').textContent = CONFIG.strings.fr.nogl1; $('noglFr2').textContent = CONFIG.strings.fr.nogl2;
  $('noglPt1').textContent = CONFIG.strings.pt.nogl1; $('noglPt2').textContent = CONFIG.strings.pt.nogl2;
  const ld = $('sLoad'); if (ld) ld.classList.add('hidden');
  qsa('.screen, #hud').forEach(function (el) { el.classList.add('hidden'); });
  box.classList.remove('hidden');
}
function boot() {
  Save.load();
  // the bright loading screen, in the saved language, while the textures and models are made
  $('ldT1').textContent = t('title1'); $('ldT2').textContent = t('title2'); $('ldTx').textContent = t('loading');
  document.documentElement.lang = Save.d.lang === 'fr' ? 'fr-CA' : (Save.d.lang === 'pt' ? 'pt-BR' : 'en');
  Speech.init();
  window.setTimeout(boot2, 60);                             // let the loading screen appear first
}
function boot2() {
  let okGL = false;
  try { okGL = GLR.init(); } catch (e) { okGL = false; }   // no WebGL (or a broken driver): the friendly message, never a crash
  wire();
  layout();
  applySettings();
  applyLang();
  if (!okGL) { showNoGL(); return; }
  showScreen('title');
  window.requestAnimationFrame(frame);
  const ld = $('sLoad');
  window.setTimeout(function () { ld.classList.add('out'); }, 200);
  window.setTimeout(function () { ld.classList.add('hidden'); }, 800);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();
</script>
